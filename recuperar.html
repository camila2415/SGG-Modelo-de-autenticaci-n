<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SGG - Recuperar contraseña</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

    <h1>Sistema de Gestión de Gastos</h1>

    <button id="btnTema">
        🌙 Modo Día/Noche
    </button>

</header>



<main>


<h2>Cambiar contraseña</h2>


<form id="formRecuperar">


<label for="emailRecuperar">
Correo electrónico
</label>

<input 
type="email"
id="emailRecuperar"
required
>



<label for="nuevaPassword">
Nueva contraseña
</label>


<input
type="password"
id="nuevaPassword"
required
>


<button 
type="button"
id="verNuevaPassword">
👁 Mostrar contraseña
</button>



<ul id="requisitos">


<li id="longitud">❌ Mínimo 8 caracteres</li>

<li id="mayuscula">❌ Una letra mayúscula</li>

<li id="minuscula">❌ Una letra minúscula</li>

<li id="numero">❌ Un número</li>

<li id="especial">❌ Un símbolo especial</li>


</ul>



<label for="repetirNuevaPassword">
Repetir contraseña
</label>


<input
type="password"
id="repetirNuevaPassword"
required
>



<button
type="submit"
id="btnCambiar"
disabled
>
Cambiar contraseña
</button>



</form>



<br>


<a href="index.html">
Volver al inicio
</a>



</main>



<script src="js/usuarios.js"></script>

<script src="js/tema.js"></script>

<script src="js/recuperar.js"></script>


</body>

</html>
